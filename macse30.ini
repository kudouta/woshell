# MAME の SE/30 の設定 (このフォルダで mame macse30 を実行すると読み込まれる)
# 場所はこのフォルダからの相対で書いてある。
# ROM はリポジトリーに入っていない。手持ちの SE/30 の ROM (macse30 のセット) を mame/roms/macse30/ に置く。
#
#   mame macse30

rompath                   mame/roms
cfg_directory             mame/cfg
nvram_directory           mame/nvram
snapshot_directory        mame/snap
flop1                     build/woshell1440.img
window                    1
maximize                  0
skip_gameinfo             1
